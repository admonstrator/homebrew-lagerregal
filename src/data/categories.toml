[[heuristic]]
category = "Networking"
keywords = [
  "network", "packet", "firewall", "vpn", "proxy", "tunnel", "load balanc",
  "bandwidth", "traffic analy", "port scan",
  "http server", "web server", "http/", "https ", "ssh ", " ssh", "sftp",
