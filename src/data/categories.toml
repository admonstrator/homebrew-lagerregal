[[heuristic]]
category = "Libraries"
# Deliberately last before Uncategorized. "library" matches well over a
# thousand formulae, almost all of them dependency-only - which is exactly
# why it must run after every category that has something specific to say
# about what the library is *for* (a graphics library is Media & Graphics,
# a DNS library is DNS). What is left here is the generic C/system
# plumbing: glib, libffi, boost, gettext, libtool.
keywords = [
  "library", "libraries", "bindings", "header files", "shared object",
  "abi ", "foreign function", "abstractions framework", "perl lib",
  # Very common shapes for a library that never says the word: "portable
  # implementation of <spec>", "<language> port of <thing>", "framework
  # for <x>". Safe only because Libraries runs last.
  "implementation of", "port of", "framework", "routines", "simd", "malloc",
]
