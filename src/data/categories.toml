category = "Cryptography"
keywords = [
  "cryptograph", "encrypt", " tls", "ssl", "certificate", "pgp", "gpg",
  # Short keywords above now require a word boundary, so the compounds
  # they used to catch mid-word need naming explicitly.
  "openssl", "libressl", "openpgp", "gnupg",
  "transport layer security", "public key", "private key", "x.509",
  "pkcs", "cipher", "keychain", "digital signature", "signing key",
  "secret management", "hashing algorithm", "key derivation",
]

[[heuristic]]
