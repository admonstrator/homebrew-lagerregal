# Curated classification data bundled into the `lagerregal` binary at compile time.
#
# `curated`: exact package-name -> category lookup, checked before any heuristic.
# `heuristics`: category -> list of lowercase substrings matched against a package's
# `desc` field when no curated entry exists. First matching category wins; order
# follows the table below (top to bottom).

[curated]
