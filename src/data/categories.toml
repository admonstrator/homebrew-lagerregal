# Evaluated top to bottom; the first category whose keyword appears in a
# package's `desc` wins. More specific categories are listed before more
# generic ones (e.g. Security/DNS before the catch-all Productivity).
[[heuristic]]
category = "Security"
keywords = ["security", "exploit", "vulnerab", "penetration", "malware", "antivirus", "password crack", "password manager", "forensic", "intrusion", "brute force", "reverse engineer", "privacy"]

[[heuristic]]
category = "AI & Machine Learning"
keywords = ["machine learning", "language model", " llm", "artificial intelligence", "neural network", "generative ai", "openai", "computer vision"]

[[heuristic]]
category = "DNS"
keywords = ["dns", "domain name system", "name server", "nameserver", "whois"]

[[heuristic]]
category = "Cryptography"
keywords = ["cryptograph", "encrypt", " tls", "ssl", "certificate", "pgp", "gpg"]

[[heuristic]]
category = "Networking"
keywords = ["network", "packet", "firewall", "vpn", "proxy", "tunnel", "load balanc", "bandwidth", "traffic analy", "port scan"]

[[heuristic]]
category = "Media & Graphics"
keywords = ["video", "audio codec", "audio editor", "image editing", "image manipulat", "screen record", "transcod", "photo editing", "screenshot", "music"]

[[heuristic]]
category = "Fonts"
# Matched against name+desc together: most `font-*` casks (there are
# thousands) ship with no `desc` at all, only a name that starts with
# "font-", so the "font-" keyword below matches on the name instead.
keywords = ["font-", "typeface", "font family"]

[[heuristic]]
category = "Documents & PDF"
keywords = ["pdf", "document editor", "markdown", "word processing", "note-taking", "knowledge base", "ocr", "optical character recognition"]

[[heuristic]]
category = "Monitoring"
keywords = ["monitor", "metrics", "observability", "log aggregat", "dashboard", "telemetry"]

[[heuristic]]
category = "Databases"
keywords = ["database", " sql", "key-value store", "document store", "time series"]

[[heuristic]]
category = "Cloud & Infra"
keywords = ["cloud", "kubernetes", "container", "infrastructure as code", "orchestrat", "provisioning", "virtual machine", "virtualization"]

[[heuristic]]
category = "Dev Tools & Languages"
keywords = ["compiler", "programming language", "interpreter", "build system", "version control", "package manager", "linter", "git ", "language server"]

[[heuristic]]
category = "System Utilities"
keywords = ["clean up", "cleaner", "uninstall", "disk usage", "disk space", "window manager", "clipboard manager", "bootable", "data recovery", "menu bar app"]

[[heuristic]]
category = "Communication & Browsers"
keywords = ["web browser", "chat", "video call", "email client", "messaging app"]

[[heuristic]]
category = "Games & Emulation"
keywords = ["game", "emulat", "gaming"]

[[heuristic]]
category = "Productivity"
keywords = ["terminal", "shell", "file manager", "text editor", "file retriever", "personal organizer", "file archiver"]
