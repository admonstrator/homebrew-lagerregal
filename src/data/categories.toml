# Evaluated top to bottom; the first category whose keyword appears in a
# package's name + `desc` wins. More specific categories are listed before
# more generic ones, and three "catch-all-ish" categories are deliberately
# placed late: Games & Emulation (after Virtualization, so a machine
# emulator/virtualizer isn't a game), Productivity (the terminal/workflow
# bucket), and Libraries (a fallback just above Uncategorized - "library"
# matches thousands of formulae, so it must only see what nothing else
# claimed).
#
# Keyword design notes:
#   * Keywords of <=4 chars must start at a word boundary (see
#     BOUNDARY_REQUIRED_UP_TO in classify.rs), but may still grow to the
#     right - which is why "tex" is NOT a keyword here: it would match
#     "text editor". Spell such stems out ("latex", "texlive") instead.
#   * Wrapping a short word in spaces (" ai ", " ide ") makes it exact:
#     the leading space is not alphanumeric, so the boundary rule is
#     skipped and the trailing space blocks "identifier"/"aim".

[[heuristic]]
category = "Security"
keywords = [
  "security", "exploit", "vulnerab", "penetration", "malware", "antivirus",
  "password crack", "password manager", "password vault", "login vault",
  "forensic", "intrusion", "brute force", "reverse engineer", "privacy",
  "rootkit", "keylogg", "phishing", "two-factor", "one-time password",
  "totp", "yubikey", "hardening", "secrets", "cve ", "sandbox escape",
  "credentials", "audit tool", "threat",
]
# A privacy-focused *browser* is a browser; a TLS/crypto library belongs
# under Cryptography. Both used to be swallowed by "privacy"/"security".
exclude = [
  "web browser", "browser focus", "fork of firefox", "chromium",
  "transport layer security", "security-enabled",
]

[[heuristic]]
category = "AI & Machine Learning"
keywords = [
  "machine learning", "language model", " llm", "llm ", "artificial intelligence",
  "neural network", "generative ai", "openai", "computer vision", "deep learning",
  # The current generation of CLI/desktop AI tooling describes itself as
  # "AI <something>" or by vendor name, none of which the older keywords
  # above catch - claude-code, codex, gemini-cli and friends all used to
  # land in Productivity ("terminal") or Uncategorized.
  " ai ", "ai-powered", "ai coding", "ai agent", "ai assistant", "ai model",
  "ai chat", "ai desktop", "coding agent", "coding assistant",
  "chatgpt", "anthropic", "claude", "copilot", "gemini-cli", "google gemini",
  "ollama", "llama", "hugging face", "huggingface", "transformers",
  "inference", "embeddings", "stable diffusion", "text-to-speech",
  "speech recognition", "speech-to-text", "tensorflow", "pytorch",
  "model context protocol", "prompt engineering",
]
# "gemini" is also an internet protocol with its own browsers/servers, and
# "claude"/"llama" can show up as a font or an animal package name.
exclude = ["gemini protocol", "gemini client", "gemini server", "font-"]

[[heuristic]]
category = "DNS"
keywords = ["dns", "ddns", "subdomain", "domain name system", "name server", "nameserver", "whois"]

