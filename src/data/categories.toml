# Curated classification data bundled into the `lagerregal` binary at compile time.
#
# `curated`: exact package-name -> category lookup, checked before any heuristic.
# `heuristic`: ordered list of {category, keywords}, matched (in order) against a
# package's `desc` field when no curated entry exists. First matching category wins.
#
# The curated list and keyword choices were validated against a real
# `brew info --json=v2 --installed` dump (~180 explicitly-installed formulae
# and casks) to keep the "Uncategorized" bucket small in practice, not just
# in theory.

