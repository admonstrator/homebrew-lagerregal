exclude = ["cloud storage", "terminal emulat", "terminal-emulat"]

[[heuristic]]
category = "Fonts"
# Matched against name+desc together: most `font-*` casks (there are
# thousands) ship with no `desc` at all, only a name that starts with
# "font-", so the "font-" keyword below matches on the name instead.
# Listed above Media & Graphics so font *rendering/shaping* libraries
# (freetype, harfbuzz, fontconfig) file as Fonts rather than as graphics.
keywords = [
  "font-", "typeface", "font family", "font editor", "render fonts",
  "font render", "text shaping", "opentype", "truetype", "font config",
  "fontconfig", "glyph",
]

