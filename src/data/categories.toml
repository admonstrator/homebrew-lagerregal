# Evaluated top to bottom; the first category whose keyword appears in a
# package's `desc` wins. More specific categories are listed before more
# generic ones (e.g. Security/DNS before the catch-all Productivity).
[[heuristic]]
category = "Security"
keywords = ["security", "exploit", "vulnerab", "penetration", "malware", "antivirus", "password crack", "forensic", "intrusion", "brute force", "reverse engineer"]

[[heuristic]]
category = "DNS"
keywords = ["dns", "domain name system", "name server", "nameserver"]

[[heuristic]]
category = "Cryptography"
keywords = ["cryptograph", "encrypt", " tls", "ssl", "certificate", "pgp", "gpg"]

[[heuristic]]
category = "Networking"
keywords = ["network", "packet", "firewall", "vpn", "proxy", "tunnel", "load balanc", "bandwidth", "traffic analy"]

[[heuristic]]
category = "Monitoring"
keywords = ["monitor", "metrics", "observability", "log aggregat", "dashboard", "telemetry"]

[[heuristic]]
category = "Databases"
keywords = ["database", " sql", "key-value store", "document store", "time series"]

[[heuristic]]
category = "Cloud & Infra"
keywords = ["cloud", "kubernetes", "container", "infrastructure as code", "orchestrat", "provisioning", "virtual machine"]

[[heuristic]]
category = "Dev Tools & Languages"
keywords = ["compiler", "programming language", "interpreter", "build system", "version control", "package manager", "linter"]

[[heuristic]]
category = "Productivity"
keywords = ["terminal", "shell", "file manager", "text editor", "file retriever"]
