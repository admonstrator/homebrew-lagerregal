name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without having to repeat `-D warnings` per step.
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Apple Silicon: the only target this project ships, so it's also the
    # only one worth testing on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      # Cheap smoke test: the binary should at least start and answer --help
      # without a Homebrew install present. Anything that actually shells out
      # to `brew` is deliberately left to the local test suite.
      - name: Smoke test
        run: |
          ./target/release/lagerregal --version
          ./target/release/lagerregal --help
