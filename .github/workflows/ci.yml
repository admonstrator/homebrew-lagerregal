name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without having to repeat `-D warnings` per step.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.target }})
    # Every target this project ships for, each built and tested on a runner
    # of its own architecture (no cross-compilation, no Rosetta, no QEMU) so
    # a target only counts as working once it has actually run on that
    # hardware. The Linux legs use musl to match what the release ships.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            # GitHub's last Intel macOS image; retiring alongside macOS 15
            # support (~fall 2027). Re-check actions/runner-images if this
            # label ever stops working.
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup component add clippy rustfmt
          rustup target add ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      # The runner's architecture always matches the target, so these run
      # rather than just cross-compile - including the musl legs, whose
      # statically linked test binaries execute fine on a glibc host.
      - name: Tests
        run: cargo test --target ${{ matrix.target }}

      # --locked here as well as in the release build: a Cargo.lock that no
      # longer matches Cargo.toml should fail in CI, not when cutting a tag.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Cheap smoke test: the binary should at least start and answer --help
      # without a Homebrew install present. Anything that actually shells out
      # to `brew` is deliberately left to the local test suite.
      - name: Smoke test
        run: |
          ./target/${{ matrix.target }}/release/lagerregal --version
          ./target/${{ matrix.target }}/release/lagerregal --help
