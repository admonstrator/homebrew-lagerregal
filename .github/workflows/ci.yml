name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without having to repeat `-D warnings` per step.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.target }})
    # Both Mac architectures this project ships for, each built and tested
    # natively (no cross-compilation, no Rosetta) so a target only counts as
    # working once it has actually run on that hardware.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            # GitHub's last Intel macOS image; retiring alongside macOS 15
            # support (~fall 2027). Re-check actions/runner-images if this
            # label ever stops working.
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      # Cheap smoke test: the binary should at least start and answer --help
      # without a Homebrew install present. Anything that actually shells out
      # to `brew` is deliberately left to the local test suite.
      - name: Smoke test
        run: |
          ./target/release/lagerregal --version
          ./target/release/lagerregal --help
