name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # One runner per target, each building natively for the platform it ships
  # to. The Linux targets are musl rather than gnu on purpose: the binary
  # links statically, so it doesn't inherit the glibc version of whatever
  # runner image built it and runs on old and new distributions alike.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            # Cross-linked from the Apple Silicon image; Xcode's toolchain
            # handles this fine, and CI has already built and tested this
            # target on real Intel hardware.
            runner: macos-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # A tag whose version disagrees with Cargo.toml would ship a binary
      # that reports a different version than the formula installs. Catch it
      # here rather than after publishing - a failure in any matrix leg
      # leaves the release job with nothing to publish.
      - name: Verify tag matches Cargo.toml version
        run: |
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$manifest" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${{ steps.version.outputs.version }}"
          archive="lagerregal-${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" lagerregal

      - uses: actions/upload-artifact@v4
        with:
          name: lagerregal-${{ matrix.target }}
          path: lagerregal-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Only for creating the Release in this repo - GITHUB_TOKEN is enough
      # for that. Pushing the regenerated formula to homebrew-tap is a
      # separate repo, so that step uses the GH_TAP_PAT secret instead.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums are taken here rather than per-target so they all come from
      # one tool on one runner - `shasum` vs `sha256sum` differ across the
      # macOS and Linux images, and a formula is only as good as its hashes.
      - name: Checksum artifacts
        id: sums
        run: |
          version="${{ steps.version.outputs.version }}"
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            archive="dist/lagerregal-${version}-${target}.tar.gz"
            if [ ! -f "$archive" ]; then
              echo "::error::missing build artifact $archive"
              exit 1
            fi
            sha="$(sha256sum "$archive" | cut -d' ' -f1)"
            echo "${target//-/_}=$sha" >> "$GITHUB_OUTPUT"
            echo "$sha  $archive"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

      # The formula lives in admonstrator/homebrew-tap, the shared tap for
      # every brew-distributed project, not in this repo. GITHUB_TOKEN only
      # has permissions in this repo, so pushing there needs a dedicated
      # token: GH_TAP_PAT, a fine-grained PAT scoped to contents:write on
      # homebrew-tap only.
      - name: Update formula in homebrew-tap
        env:
          GH_TAP_PAT: ${{ secrets.GH_TAP_PAT }}
        run: |
          version="${{ steps.version.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          git clone "https://x-access-token:${GH_TAP_PAT}@github.com/admonstrator/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          cat > Formula/lagerregal.rb <<EOF
          # Generated by .github/workflows/release.yml on every tagged release.
          # Edits here are overwritten; change the workflow instead.
          class Lagerregal < Formula
            desc "Classify and browse your installed Homebrew packages by category"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/lagerregal-${version}-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.sums.outputs.aarch64_apple_darwin }}"
              end
              on_intel do
                url "${base}/lagerregal-${version}-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.sums.outputs.x86_64_apple_darwin }}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/lagerregal-${version}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${{ steps.sums.outputs.aarch64_unknown_linux_musl }}"
              end
              on_intel do
                url "${base}/lagerregal-${version}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${{ steps.sums.outputs.x86_64_unknown_linux_musl }}"
              end
            end

            def install
              bin.install "lagerregal"
            end

            test do
              assert_match "lagerregal", shell_output("#{bin}/lagerregal --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lagerregal.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "lagerregal ${version}"
            git push origin main
          fi
