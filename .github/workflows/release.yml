name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    env:
      # Hoisted to the job so the tap step's `if:` can test it - step-level
      # `env` is not yet in scope when that condition is evaluated.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    permissions:
      # Needed to create the GitHub Release below. The tap push uses a
      # separate PAT (HOMEBREW_TAP_TOKEN), since it writes to another repo.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # A tag whose version disagrees with Cargo.toml would ship a binary
      # that reports a different version than the formula installs. Catch it
      # here rather than after publishing.
      - name: Verify tag matches Cargo.toml version
        run: |
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$manifest" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml version $manifest"
            exit 1
          fi

      # Both Mac architectures ship from this one Apple Silicon runner:
      # Xcode's toolchain links x86_64-apple-darwin just fine from an arm64
      # host, so there's no need for a second runner (and no need for
      # GitHub's Intel image, which is on a retirement clock) just to
      # produce the release artifact. CI separately builds+tests each
      # target natively, so correctness on real hardware is already covered.
      - name: Add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin

      - name: Build aarch64-apple-darwin
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64-apple-darwin
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"

          arm_archive="lagerregal-${version}-aarch64-apple-darwin.tar.gz"
          tar -czf "$arm_archive" -C "target/aarch64-apple-darwin/release" lagerregal
          arm_sha="$(shasum -a 256 "$arm_archive" | cut -d' ' -f1)"
          echo "arm_archive=$arm_archive" >> "$GITHUB_OUTPUT"
          echo "arm_sha256=$arm_sha" >> "$GITHUB_OUTPUT"

          intel_archive="lagerregal-${version}-x86_64-apple-darwin.tar.gz"
          tar -czf "$intel_archive" -C "target/x86_64-apple-darwin/release" lagerregal
          intel_sha="$(shasum -a 256 "$intel_archive" | cut -d' ' -f1)"
          echo "intel_archive=$intel_archive" >> "$GITHUB_OUTPUT"
          echo "intel_sha256=$intel_sha" >> "$GITHUB_OUTPUT"

          echo "$arm_sha  $arm_archive"
          echo "$intel_sha  $intel_archive"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.arm_archive }}
            ${{ steps.package.outputs.intel_archive }}
          generate_release_notes: true

      # Rewrites the tap's formula to point at the release just published.
      # Skipped (rather than failed) when the token is absent, so the release
      # itself still succeeds on a repo that hasn't set the tap up yet.
      - name: Update Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          TAP_REPO: admonstrator/homebrew-lagerregal
        run: |
          version="${{ steps.version.outputs.version }}"
          arm_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.arm_archive }}"
          arm_sha="${{ steps.package.outputs.arm_sha256 }}"
          intel_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.intel_archive }}"
          intel_sha="${{ steps.package.outputs.intel_sha256 }}"

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/lagerregal.rb <<EOF
          # This file is generated by the release workflow in
          # ${GITHUB_REPOSITORY}. Edits here are overwritten on the next release.
          class Lagerregal < Formula
            desc "Classify and browse your installed Homebrew packages by category"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            if Hardware::CPU.arm?
              url "${arm_url}"
              sha256 "${arm_sha}"
            else
              url "${intel_url}"
              sha256 "${intel_sha}"
            end

            depends_on :macos

            def install
              bin.install "lagerregal"
            end

            test do
              assert_match "lagerregal", shell_output("#{bin}/lagerregal --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lagerregal.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "lagerregal ${version}"
            git push
          fi
