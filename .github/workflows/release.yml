name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  release:
    runs-on: macos-latest
    env:
      # Hoisted to the job so the tap step's `if:` can test it - step-level
      # `env` is not yet in scope when that condition is evaluated.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    permissions:
      # Needed to create the GitHub Release below. The tap push uses a
      # separate PAT (HOMEBREW_TAP_TOKEN), since it writes to another repo.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # A tag whose version disagrees with Cargo.toml would ship a binary
      # that reports a different version than the formula installs. Catch it
      # here rather than after publishing.
      - name: Verify tag matches Cargo.toml version
        run: |
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$manifest" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Build
        run: cargo build --release --target "$TARGET"

      - name: Package
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          archive="lagerregal-${version}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" lagerregal
          sha="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha  $archive"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true

      # Rewrites the tap's formula to point at the release just published.
      # Skipped (rather than failed) when the token is absent, so the release
      # itself still succeeds on a repo that hasn't set the tap up yet.
      - name: Update Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          TAP_REPO: admonstrator/homebrew-lagerregal
        run: |
          version="${{ steps.version.outputs.version }}"
          archive="${{ steps.package.outputs.archive }}"
          sha="${{ steps.package.outputs.sha256 }}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}"

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/lagerregal.rb <<EOF
          # This file is generated by the release workflow in
          # ${GITHUB_REPOSITORY}. Edits here are overwritten on the next release.
          class Lagerregal < Formula
            desc "Classify and browse your installed Homebrew packages by category"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "${url}"
            sha256 "${sha}"
            version "${version}"
            license "MIT"

            depends_on :macos
            depends_on arch: :arm64

            def install
              bin.install "lagerregal"
            end

            test do
              assert_match "lagerregal", shell_output("#{bin}/lagerregal --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lagerregal.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "lagerregal ${version}"
            git push
          fi
