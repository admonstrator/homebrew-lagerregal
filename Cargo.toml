[package]
name = "lagerregal"
version = "0.5.0"
edition = "2024"
description = "Classify and browse your installed Homebrew packages by category"
license = "MIT"
repository = "https://github.com/admonstrator/homebrew-lagerregal"

[[bin]]
name = "lagerregal"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
directories = "5"
comfy-table = "7"
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
lto = true
strip = true
